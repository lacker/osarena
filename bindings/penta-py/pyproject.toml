[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "penta"
version = "0.3.0"
description = "A deterministic multi-format Magic engine for writing AI bots"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module"]
